<div id="app" class="app"></div>
<script>
const PROJECTORS = [
  {brand:'Panasonic',model:'PT-LB306',brightness:3100,resolution:'XGA · 1024 × 768',aspect:'4:3',tmin:1.47,tmax:1.77,category:'Phòng họp / lớp học'},
  {brand:'Panasonic',model:'PT-LB356',brightness:3300,resolution:'XGA · 1024 × 768',aspect:'4:3',tmin:1.48,tmax:1.78,category:'Phòng họp / lớp học'},
  {brand:'Panasonic',model:'PT-LW376',brightness:3600,resolution:'WXGA · 1280 × 800',aspect:'16:10',tmin:1.48,tmax:1.78,category:'Phòng họp / lớp học'},
  {brand:'Panasonic',model:'PT-LB426',brightness:4100,resolution:'XGA · 1024 × 768',aspect:'4:3',tmin:1.48,tmax:1.78,category:'Phòng họp / lớp học'},
  {brand:'Panasonic',model:'PT-VW360',brightness:4000,resolution:'WXGA · 1280 × 800',aspect:'16:10',tmin:1.2,tmax:1.9,category:'Phòng họp / doanh nghiệp'},
  {brand:'Panasonic',model:'PT-VX430',brightness:4500,resolution:'XGA · 1024 × 768',aspect:'4:3',tmin:1.2,tmax:1.9,category:'Phòng họp / doanh nghiệp'},

  {brand:'Panasonic',model:'PT-LMZ460',brightness:4600,resolution:'WUXGA · 1920 × 1200',aspect:'16:10',tmin:1.36,tmax:1.64,category:'Phòng họp / doanh nghiệp'},
  {brand:'Panasonic',model:'PT-VMZ51',brightness:5200,resolution:'WUXGA · 1920 × 1200',aspect:'16:10',tmin:1.09,tmax:1.77,category:'Phòng họp / doanh nghiệp'},
  {brand:'Panasonic',model:'PT-VMZ51S',brightness:5200,resolution:'WUXGA · 1920 × 1200',aspect:'16:10',tmin:1.09,tmax:1.77,category:'Phòng họp / doanh nghiệp'},
  {brand:'Panasonic',model:'PT-VMZ62',brightness:6500,resolution:'WUXGA · 1920 × 1200',aspect:'16:10',tmin:1.09,tmax:1.77,category:'Hội trường / doanh nghiệp'},
  {brand:'Panasonic',model:'PT-VMZ72',brightness:7200,resolution:'WUXGA · 1920 × 1200',aspect:'16:10',tmin:1.09,tmax:1.77,category:'Hội trường / doanh nghiệp'},
  {brand:'Panasonic',model:'PT-MZ570',brightness:5500,resolution:'WUXGA · 1920 × 1200',aspect:'16:10',tmin:1.6,tmax:2.8,category:'Hội trường / phòng họp lớn'},
  {brand:'Panasonic',model:'PT-MZ780',brightness:7000,resolution:'WUXGA · 1920 × 1200',aspect:'16:10',tmin:1.61,tmax:2.76,category:'Hội trường / phòng họp lớn'},
  {brand:'Panasonic',model:'PT-MZ882W',brightness:8200,resolution:'WUXGA · 1920 × 1200',aspect:'16:10',tmin:null,tmax:null,category:'Hội trường / phòng họp lớn'},
  {brand:'Acer',model:'X1128H',brightness:4800,resolution:'SVGA · 800 × 600',aspect:'4:3',tmin:1.94,tmax:2.16,category:'Phòng họp / lớp học'},
  {brand:'Acer',model:'X1228H',brightness:4800,resolution:'XGA · 1024 × 768',aspect:'4:3',tmin:1.94,tmax:2.16,category:'Phòng họp / lớp học'},
  {brand:'Acer',model:'X128HP',brightness:4000,resolution:'XGA · 1024 × 768',aspect:'4:3',tmin:1.94,tmax:2.16,category:'Phòng họp / lớp học'},
  {brand:'Acer',model:'P1257i',brightness:4800,resolution:'XGA · 1024 × 768',aspect:'4:3',tmin:1.51,tmax:1.97,category:'Phòng họp / wireless'},
  {brand:'Acer',model:'H5386Bdi',brightness:4500,resolution:'HD · 1280 × 720',aspect:'16:9',tmin:1.49,tmax:1.93,category:'Home entertainment'},
  {brand:'Acer',model:'PL2520i',brightness:4000,resolution:'Full HD · 1920 × 1080',aspect:'16:9',tmin:1.12,tmax:1.47,category:'Doanh nghiệp / 24-7'}
];
const PROJECTOR_PRICES = {'PT-LB306':13600000,'PT-LB356':14700000,'PT-LW376':17200000,'PT-LB426':17850000,'PT-VW360':19200000,'PT-VX430':21200000,'PT-VZ580':48800000,'PT-LMZ460':44300000,'PT-VMZ51':56500000,'PT-VMZ51S':54200000,'X1128H':8800000,'X128HP':10300000,'P1257i':13650000,'H5386Bdi':13500000,'PL2520i':31500000};
const screenAspect=(width,height)=>{const ratio=width/height;if(Math.abs(ratio-1)<.03)return '1:1';if(Math.abs(ratio-4/3)<.03)return '4:3';if(Math.abs(ratio-16/10)<.03)return '16:10';if(Math.abs(ratio-16/9)<.03)return '16:9';return `${ratio.toFixed(2).replace('.',',')}:1`};
const SCREENS=[
  ['100" (1,78 m × 1,78 m)',1.78,1.78],['120" (2,13 m × 2,13 m)',2.13,2.13],['135" (2,44 m × 2,44 m)',2.44,2.44],['150" (3,05 m × 2,3 m)',3.05,2.3],['170" (3,05 m × 3,05 m)',3.05,3.05],['200" (3,66 m × 3,66 m)',3.66,3.66],['200" (4,07 m × 3,05 m)',4.07,3.05],['250" (5,03 m × 3,8 m)',5.03,3.8],['300" (6,1 m × 4,6 m)',6.1,4.6]
].map((x,i)=>({id:'screen-'+i,label:x[0],width:x[1],height:x[2],ratio:screenAspect(x[1],x[2])}));
const fmt=(n,d=2)=>Number(n).toFixed(d).replace('.',',');
const meters=n=>`${fmt(n)} m`;
const throwText=p=>p.tmin===null?'Chưa có throw ratio':`${fmt(p.tmin)} – ${fmt(p.tmax)}:1`;
const brands=[...new Set(PROJECTORS.map(p=>p.brand))];
  let state={mode:'room',view:'calc',brand:'',model:'',screen:'',roomWidthRoom:'',roomDepthRoom:'',roomWidthModel:'',roomDepthModel:'',roomErrorRoom:'',roomErrorModel:'',custom:false,customW:3.05,customH:2.3,compareA:'PT-VMZ62',compareB:'PL2520i'};
  Object.defineProperties(state,{width:{enumerable:true,get(){return state.mode==='room'?state.roomWidthRoom:state.roomWidthModel},set(value){if(state.mode==='room')state.roomWidthRoom=value;else state.roomWidthModel=value}},depth:{enumerable:true,get(){return state.mode==='room'?state.roomDepthRoom:state.roomDepthModel},set(value){if(state.mode==='room')state.roomDepthRoom=value;else state.roomDepthModel=value}},roomError:{enumerable:true,get(){return state.mode==='room'?state.roomErrorRoom:state.roomErrorModel},set(value){if(state.mode==='room')state.roomErrorRoom=value;else state.roomErrorModel=value}}});
const app=document.getElementById('app');
 function screenValue(){const width=Number(state.customW)||.1,height=Number(state.customH)||.1;return state.custom?{label:`Tùy chỉnh (${fmt(Math.hypot(width,height)/.0254,0)}" · ${fmt(width)} m × ${fmt(height)} m)`,width,height,ratio:screenAspect(width,height)}:SCREENS[state.screen]||{label:'Chưa chọn màn',width:.1,height:.1,ratio:'—'}}
function bestForRoom(){const sw=state.width*.85;const target=state.depth;let best=null;PROJECTORS.forEach(p=>SCREENS.forEach(s=>{const has=p.tmin!==null;const min=has?s.width*p.tmin:0,max=has?s.width*p.tmax:0;const fitW=s.width<=sw,fitD=has&&min<=target&&max<=target,bright=p.brightness>=(state.width*state.depth<20?3000:state.width*state.depth<40?4000:state.width*state.depth<70?5000:6500);const score=(fitW?0:2)+(fitD?0:2)+(bright?0:.8)+(has?0:4)+(!has?4:Math.abs(target-(min+max)/2)/Math.max(target,1));if(!best||score<best.score)best={p,s,min,max,score}}));return best}
function chosen(){if(state.mode==='room'){const best=bestForRoom();return {p:best.p,s:best.s,min:best.min,max:best.max}}const p=PROJECTORS.find(x=>x.model===state.model)||PROJECTORS[0];const s=screenValue();return {p,s,min:p.tmin===null?null:s.width*p.tmin,max:p.tmax===null?null:s.width*p.tmax}}
function calc(){const c=chosen();const ideal=c.min===null?null:(c.min+c.max)/2;const area=state.width*state.depth;const target=area<20?3000:area<40?4000:area<70?5000:6500;const wall=c.s.width<=state.width*.85;const depthOk=c.max!==null&&c.max<=state.depth;return {...c,ideal,area,target,wall,depthOk,ready:wall&&depthOk&&c.min!==null}}
 function optionList(){return `<option value="" selected disabled>${state.brand?'Chọn model máy chiếu':'Chọn hãng trước'}</option>`+PROJECTORS.filter(p=>p.brand===state.brand).map(p=>`<option value="${p.model}" ${p.model===state.model?'selected':''}>${p.model}</option>`).join('')}
 function form(){const c=calc();const brandButtons=brands.map(b=>`<button class="brand ${state.brand===b?'active':''}" onclick="setBrand('${b}')">${b}</button>`).join('');return `<section class="card"><div class="cardhead"><div><h2>Thông tin phòng</h2><span class="step">01 / INPUT</span></div><span>☷</span></div><div class="form"><div class="row"><div class="field"><label>Rộng phòng</label><div class="unit"><input type="number" min="1" step=".1" value="${state.width}" onchange="setRoom('width',this.value)"><span>m</span></div><span class="hint">Mặt tường đặt màn</span></div><div class="field"><label>Dài phòng</label><div class="unit"><input type="number" min="1" step=".1" value="${state.depth}" onchange="setRoom('depth',this.value)"><span>m</span></div><span class="hint">Từ màn đến tường sau</span></div></div><div class="field"><label>Loại không gian</label><select><option>${c.area>60?'Hội trường / không gian lớn':c.area>30?'Phòng họp / văn phòng':'Phòng nhỏ / lớp học'}</option></select></div>${state.mode==='model'?`<div class="select-title">HÃNG / MODEL ĐANG TÍNH</div><div class="brand-row">${brandButtons}</div><div class="field"><label>Model máy chiếu</label><select onchange="setModel(this.value)">${optionList()}</select></div><div class="data-note">${state.brand?`${PROJECTORS.filter(p=>p.brand===state.brand).length} model ${state.brand} · ${PROJECTORS.filter(p=>p.brand===state.brand&&p.tmin!==null).length} model có throw ratio`:'Chọn hãng để xem model'}</div>`:`<div class="custom"><div class="custom-title">✦ Tự gợi ý theo kích thước phòng</div><span class="hint">Hệ thống chọn màn không quá 85% bề ngang, sau đó xếp model theo throw ratio và độ sáng.</span></div>`}<div class="select-title">MÀN CHIẾU</div><div class="field"><label>Kích thước màn đang tính</label><select onchange="setScreen(this.value)" ${state.mode==='room'?'disabled':''}>${state.screen===''&&!state.custom?'<option value="" selected disabled>Chọn kích thước màn</option>':''}${SCREENS.map((s,i)=>`<option value="${i}" ${!state.custom&&state.screen===i?'selected':''}>${s.label}</option>`).join('')}<option value="custom" ${state.custom?'selected':''}>Màn tùy chỉnh</option></select></div>${state.custom?`<div class="custom"><div class="custom-title">Nhập màn chiếu thực tế</div><div class="row"><div class="field"><label>Ngang</label><div class="unit"><input type="number" min=".1" step=".01" value="${state.customW}" onchange="setCustom('customW',this.value)"><span>m</span></div></div><div class="field"><label>Cao</label><div class="unit"><input type="number" min=".1" step=".01" value="${state.customH}" onchange="setCustom('customH',this.value)"><span>m</span></div></div></div></div>`:''}<button class="calc" onclick="render()">TÍNH PHƯƠNG ÁN</button></div><div class="summary"><span class="summary-label">Tiêu chí đang áp dụng</span><div class="pills"><span class="pill">Lens → màn</span><span class="pill">${state.model||'—'}</span><span class="pill">Throw ratio</span></div></div></section>`}
function result(){const c=calc();const suggestions=PROJECTORS.map(p=>{const s=c.s;const has=p.tmin!==null;const min=has?s.width*p.tmin:0,max=has?s.width*p.tmax:0;const gap=has?Math.abs(state.depth-(min+max)/2):99;return {p,min,max,fit:has&&min<=state.depth&&max<=state.depth,score:gap+(p.brightness<c.target?1:0)+(has?0:10)}}).sort((a,b)=>a.score-b.score).slice(0,3);return `<section class="card"><div class="cardhead"><div><h2>Kết quả & model gợi ý</h2><span class="step">02 / RESULT</span></div><div><button class="print" onclick="window.print()">Xuất PDF</button> <span class="status ${c.ready?'':'neutral'}">● ${c.ready?'PHÙ HỢP':'CẦN KIỂM TRA'}</span></div></div><div class="overview"><div class="kpi"><span>Màn đề xuất</span><b>${c.s.label.split(' / ')[0]}</b><small>${fmt(c.s.width)} m × ${fmt(c.s.height)} m</small></div><div class="kpi highlight"><span>Khoảng lắp khuyến nghị</span><b>${c.ideal===null?'Chưa đủ data':meters(c.ideal)}</b><small>Vùng lắp: ${c.min===null?'Chưa có throw ratio':`${meters(c.min)} – ${meters(c.max)}`}</small></div><div class="kpi"><span>Model đang tính</span><b>${c.p.model}</b><small>${c.p.brightness.toLocaleString('vi-VN')} ANSI lm · ${c.p.aspect}</small></div></div><div class="recommend"><div><small>ƯU TIÊN</small><b>${c.p.brand} ${c.p.model}</b><small>${c.p.resolution} · ${c.p.category}</small></div><div><small>KHOẢNG LẮP</small><b>${c.min===null?'Thiếu data':`${meters(c.min)} – ${meters(c.max)}`}</b></div><div><small>THROW RATIO</small><b>${throwText(c.p)}</b></div><div class="${c.ready?'good':'warn'}">● ${c.ready?'PHÙ HỢP':'CẦN KIỂM TRA'}</div></div><div class="meta"><span><b>PHÒNG</b>${fmt(state.width)} m × ${fmt(state.depth)} m · ${fmt(c.area,1)} m²</span><span><b>MÀN</b>${c.s.label}</span><span><b>NGUỒN</b>Catalog Word + spec đã xác minh</span></div><div class="schematic"><div class="schematic-head"><div><span class="mono-label">SƠ ĐỒ MẶT CẮT / KHÔNG THEO TỶ LỆ</span><strong>Thấu kính → màn chiếu</strong></div><span class="distance-pill">${c.ideal===null?'—':meters(c.ideal)}</span></div><div class="room"><div class="mark screen">MÀN ${c.s.label.split(' / ')[0]}</div><div class="distance"><i></i>${c.min===null?'THIẾU THROW RATIO':`${meters(c.min)} – ${meters(c.max)}`}<em>vùng lắp đặt</em></div><div class="mark machine">MÁY CHIẾU<br><b>${c.p.model}</b></div></div></div><div class="checks"><div class="check ${c.wall?'ok':'no'}"><span>●</span><span><strong>${c.wall?'Màn vừa tường':'Màn rộng hơn tường'}</strong><small>${fmt(c.s.width)} m ngang / tối đa ${fmt(state.width*.85)} m</small></span></div><div class="check ${c.depthOk?'ok':'no'}"><span>●</span><span><strong>${c.depthOk?'Khoảng cách đủ':c.p.tmin===null?'Thiếu throw ratio':'Phòng thiếu chiều sâu'}</strong><small>${fmt(state.depth)} m chiều sâu</small></span></div><div class="check ${c.p.brightness>=c.target?'ok':'no'}"><span>●</span><span><strong>${c.p.brightness>=c.target?'Độ sáng phù hợp':'Nên tăng độ sáng'}</strong><small>${c.p.brightness.toLocaleString('vi-VN')} lm / cần từ ${c.target.toLocaleString('vi-VN')} lm</small></span></div></div><div class="suggestions"><div class="suggest-head"><h2>Model đáng xem thêm</h2><small>Top 3 · khoảng cách + độ sáng</small></div>${suggestions.map((x,i)=>`<button class="suggest-item" onclick="setModel('${x.p.model}');setMode('model')"><span class="rank">0${i+1}</span><span class="suggest-main"><strong>${x.p.brand} <em>${x.p.model}</em></strong><small>${x.p.resolution} · ${x.p.brightness.toLocaleString('vi-VN')} ANSI lm · throw ${throwText(x.p)}</small></span><span class="status ${x.fit?'':'neutral'}">${x.fit?'Vừa vùng':x.p.tmin===null?'Thiếu data':'Cần kiểm tra'}</span><span>→</span></button>`).join('')}</div><div class="footnote">ⓘ Khoảng cách tính từ thấu kính đến bề mặt màn. Offset, lens shift và giá treo cần được kiểm tra trên manual trước khi thi công.</div></section>`}
function compare(){const a=PROJECTORS.find(p=>p.model===state.compareA)||PROJECTORS[0],b=PROJECTORS.find(p=>p.model===state.compareB)||PROJECTORS[1];const rows=[['Độ sáng',`${a.brightness.toLocaleString('vi-VN')} ANSI lm`,`${b.brightness.toLocaleString('vi-VN')} ANSI lm`],['Độ phân giải',a.resolution,b.resolution],['Tỷ lệ khung hình',a.aspect,b.aspect],['Throw ratio',throwText(a),throwText(b)],['Nguồn sáng / nhóm',a.category,b.category]];return `<section class="card compare"><div class="cardhead"><div><h2>Đối chiếu thiết bị</h2><span class="step">03 / COMPARE</span></div></div><h2>Đặt hai model lên cùng một mặt bàn.</h2><p>So sánh các thông số quan trọng trước khi đưa model vào bài toán phòng và màn chiếu.</p><div class="compare-selects"><div class="compare-card"><label>Model A</label><select onchange="state.compareA=this.value;render()">${PROJECTORS.map(p=>`<option ${p.model===a.model?'selected':''}>${p.model}</option>`).join('')}</select></div><div class="vs">VS</div><div class="compare-card"><label>Model B</label><select onchange="state.compareB=this.value;render()">${PROJECTORS.map(p=>`<option ${p.model===b.model?'selected':''}>${p.model}</option>`).join('')}</select></div></div><div class="table"><table class="table-grid"><thead><tr><th>Thông số</th><th>${a.brand} / ${a.model}</th><th>${b.brand} / ${b.model}</th></tr></thead><tbody>${rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></section>`}
function render(){const brandCount=brands.map(b=>`<button class="nav ${state.view==='calc'&&state.brand===b?'active':''}" onclick="setBrand('${b}')">${b}<span class="count">${PROJECTORS.filter(p=>p.brand===b).length}</span></button>`).join('');app.innerHTML=`<aside class="side"><a class="logo" href="#"><img class="logo-mark" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M7 23V8h13l5 5v11H7z' fill='none' stroke='%23092235' stroke-width='2'/%3E%3Cpath d='M9 18 23 10' stroke='%23ffbf2f' stroke-width='3'/%3E%3C/svg%3E"><span>CHIẾU<b>ĐÚNG</b><small>AV PLACEMENT</small></span></a><div class="navlabel">TƯ VẤN</div><button class="nav ${state.view==='calc'&&state.mode==='room'?'active':''}" onclick="setMode('room')"><span class="dot"></span>Tính theo phòng</button><button class="nav ${state.view==='calc'&&state.mode==='model'?'active':''}" onclick="setMode('model')">▣ Tính theo model</button><div class="navlabel">DANH MỤC</div>${brandCount}<button class="nav" onclick="setMode('model')">＋ Thêm model</button><div class="sidefoot">Dữ liệu local · ${PROJECTORS.length} model<br>Throw ratio không tự suy đoán</div></aside><main class="main"><header class="top"><div><h1>${state.view==='compare'?'Đối chiếu thiết bị':state.mode==='room'?'Tư vấn theo không gian':'Tính theo model'}</h1><p>${state.view==='compare'?'Đặt hai model lên cùng một mặt bàn trước khi chốt thiết bị.':'Chọn phương án thiết bị trước khi đi khảo sát khách hàng.'}</p></div><div class="top-actions"><button class="top-tab ${state.view==='calc'?'active':''}" onclick="state.view='calc';render()">Máy tính</button><button class="top-tab ${state.view==='compare'?'active':''}" onclick="state.view='compare';render()">So sánh</button><button class="top-tab" onclick="window.alert('Throw distance = chiều rộng ảnh × throw ratio. Vùng min–max phụ thuộc zoom lens.')">Cách tính</button><span class="offline">● Offline / Local data</span></div></header>${state.view==='compare'?compare():`<div class="modebar"><button class="mode ${state.mode==='room'?'active':''}" onclick="setMode('room')"><span class="mode-icon">✦</span><span><strong>Tính theo phòng</strong><small>Nhập rộng/dài → gợi ý model + màn</small></span></button><button class="mode ${state.mode==='model'?'active':''}" onclick="setMode('model')"><span class="mode-icon">▣</span><span><strong>Tính theo model</strong><small>Chọn máy + màn → ra khoảng cách</small></span></button></div><div class="grid">${form()}${result()}</div>`}</main>`}
 function setMode(mode){state.mode=mode;state.view='calc';render()}function setBrand(brand){state.brand=brand;state.model='';state.mode='model';state.view='calc';render()}function setModel(model){state.model=model;const p=PROJECTORS.find(x=>x.model===model);if(p)state.brand=p.brand;render()}function setRoom(key,value){state[key]=Math.max(1,Number(value)||1);render()}function setScreen(value){if(value==='custom'){state.custom=true}else{state.custom=false;state.screen=value===''?'':Number(value)}render()}function setCustom(key,value){state[key]=Math.max(.1,Number(value)||.1);render()}render();
</script>
<script>
  const standaloneHasRoom = () => state.width !== '' && state.depth !== '';
  const standaloneHasSelections = () => Boolean(state.brand && state.model && (state.custom || state.screen !== ''));
  const standaloneCanCalculate = () => state.mode === 'room' ? standaloneHasRoom() : standaloneHasSelections();
  const standaloneLegacyCalc = calc;
  calc = function(){
    const c = standaloneLegacyCalc();
    const hasRoom = standaloneHasRoom();
    return {...c, hasRoom, wall: !hasRoom || c.wall, depthOk: !hasRoom || c.depthOk, ready: c.min !== null && (!hasRoom || (c.wall && c.depthOk))};
  };
  const standaloneLegacyResult = result;
  result = function(){
    if(standaloneCanCalculate()){
      const markup = standaloneLegacyResult();
      if(state.mode === 'model' && !standaloneHasRoom()) return markup
        .replace(/<span><b>PHÒNG<\/b>0,00 m × 0,00 m · 0,0 m²<\/span>/, '<span><b>PHÒNG<\/b>Chưa nhập kích thước phòng<\/span>')
        .replace(/<div class="check ok"><span>●<\/span><span><strong>Màn vừa tường<\/strong><small>.*?<\/small><\/span><\/div>/, '<div class="check"><span>●<\/span><span><strong>Chưa kiểm tra theo phòng<\/strong><small>Nhập chiều rộng để kiểm tra màn có vừa tường.</small><\/span><\/div>')
        .replace(/<div class="check ok"><span>●<\/span><span><strong>Khoảng cách đủ<\/strong><small>.*?<\/small><\/span><\/div>/, '<div class="check"><span>●<\/span><span><strong>Chưa kiểm tra chiều sâu<\/strong><small>Nhập chiều dài để đối chiếu vùng khoảng cách.</small><\/span><\/div>')
        .replace(/<div class="check (?:ok|no)"><span>●<\/span><span><strong>(?:Độ sáng phù hợp|Nên tăng độ sáng)<\/strong><small>.*?<\/small><\/span><\/div>/, '<div class="check"><span>●<\/span><span><strong>Chưa kiểm tra độ sáng<\/strong><small>Độ sáng sẽ được đánh giá theo diện tích phòng.</small><\/span><\/div>');
      return markup;
    }
    const title = state.mode === 'model' ? 'Chọn màn, hãng và model để bắt đầu tính' : 'Nhập kích thước phòng để bắt đầu tính';
    const copy = state.mode === 'model' ? 'Chọn màn chiếu, hãng và model ở khung bên trái. Không cần nhập kích thước phòng để tính khoảng cách từ máy đến màn.' : 'Điền rộng và dài phòng ở khung bên trái. Hai ô được để trống mặc định để nhập đúng kích thước thực tế.';
    return `<section class="card empty-card"><div class="cardhead"><div><h2>Chưa có kết quả</h2><span class="step">02 / RESULT</span></div><span>?</span></div><div class="empty-state"><div class="empty-icon">⌖</div><h3>${title}</h3><p>${copy}</p><span class="empty-note">Sau khi đủ dữ liệu, hệ thống sẽ hiện màn đề xuất, vùng khoảng cách lắp, model phù hợp và sơ đồ mặt cắt.</span></div></section>`;
  };
  setRoom = function(key,value){const normalized=String(value).trim();if(normalized===''){state[key]='';state.roomError='';render();return}const numValue=Number(normalized);if(!Number.isFinite(numValue)||numValue<.5||numValue>100){state[key]='';state.roomError=`${key==='width'?'Chiều rộng phòng':'Chiều dài phòng'} phải từ 0,5 đến 100 m.`;render();return}state[key]=numValue;state.roomError='';render()};
  function guide(){return `<section class="card guide"><div class="cardhead"><div><h2>Hướng dẫn sử dụng</h2><span class="step">04 / GUIDE</span></div><span>?</span></div><div class="guide-intro">Công cụ chạy local, không gửi dữ liệu đi nơi khác. Bạn có thể bắt đầu bằng kích thước phòng hoặc bằng một model máy chiếu đã biết.</div><div class="guide-grid"><article class="guide-card"><span class="num">01</span><h3>Chọn luồng tính</h3><p>Chọn <strong>Tính theo phòng</strong> nếu chưa biết máy. Chọn <strong>Tính theo model</strong> nếu đã có hãng, model và muốn kiểm tra vị trí lắp.</p></article><article class="guide-card"><span class="num">02</span><h3>Nhập phòng thực tế</h3><p>Điền rộng và dài phòng bằng mét. Hai ô để trống mặc định; khi chưa đủ dữ liệu, ứng dụng chỉ hiện hướng dẫn và không tính giả.</p></article><article class="guide-card"><span class="num">03</span><h3>Đọc vùng khoảng cách</h3><p>Kết quả dạng <strong>min – max</strong> là vùng đặt máy từ thấu kính đến mặt màn. Vị trí lý tưởng nằm gần trung tâm vùng này.</p></article></div><div class="guide-grid"><article class="guide-card"><span class="num">04</span><h3>Chọn màn hoặc màn tùy chỉnh</h3><p>Giữ đúng một trong 10 preset có sẵn, hoặc chọn màn tùy chỉnh rồi nhập ngang, cao và đơn vị mét/inch.</p></article><article class="guide-card"><span class="num">05</span><h3>So sánh model</h3><p>Mở tab <strong>So sánh</strong> để đặt hai model cạnh nhau theo độ sáng, độ phân giải, aspect ratio, throw ratio và nguồn dữ liệu.</p></article><article class="guide-card"><span class="num">06</span><h3>Xuất báo cáo PDF</h3><p>Khi đã nhập đủ phòng, bấm <strong>Xuất PDF</strong> trong thẻ kết quả để lưu phương án, vùng lắp, sơ đồ và cảnh báo kỹ thuật.</p></article></div><div class="guide-note">ⓘ Throw ratio thiếu dữ liệu sẽ luôn hiển thị “Chưa có throw ratio”. Trước khi thi công, vẫn cần kiểm tra offset, lens shift, giá treo và manual chính thức.</div></section>`}
  render = function(){const brandCount=brands.map(b=>`<button class="nav ${state.view==='calc'&&state.brand===b?'active':''}" onclick="setBrand('${b}')">${b}<span class="count">${PROJECTORS.filter(p=>p.brand===b).length}</span></button>`).join('');app.innerHTML=`<aside class="side"><a class="logo" href="#"><img class="logo-mark" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M7 23V8h13l5 5v11H7z' fill='none' stroke='%23092235' stroke-width='2'/%3E%3Cpath d='M9 18 23 10' stroke='%23ffbf2f' stroke-width='3'/%3E%3C/svg%3E"><span>CHIẾU<b>ĐÚNG</b><small>AV PLACEMENT</small></span></a><div class="navlabel">TƯ VẤN</div><button class="nav ${state.view==='calc'&&state.mode==='room'?'active':''}" onclick="setMode('room')"><span class="dot"></span>Tính theo phòng</button><button class="nav ${state.view==='calc'&&state.mode==='model'?'active':''}" onclick="setMode('model')">▣ Tính theo model</button><div class="navlabel">DANH MỤC</div>${brandCount}<button class="nav" onclick="setMode('model')">＋ Thêm model</button><button class="nav ${state.view==='guide'?'active':''}" onclick="state.view='guide';render()">? Hướng dẫn sử dụng</button><div class="sidefoot">Dữ liệu local · ${PROJECTORS.length} model<br>Throw ratio không tự suy đoán</div></aside><main class="main"><header class="top"><div><h1>${state.view==='compare'?'Đối chiếu thiết bị':state.view==='guide'?'Hướng dẫn sử dụng':state.mode==='room'?'Tư vấn theo không gian':'Tính theo model'}</h1><p>${state.view==='compare'?'Đặt hai model lên cùng một mặt bàn trước khi chốt thiết bị.':state.view==='guide'?'Các bước nhập dữ liệu, đọc kết quả và xuất báo cáo.':'Chọn phương án thiết bị trước khi đi khảo sát khách hàng.'}</p></div><div class="top-actions"><button class="top-tab ${state.view==='calc'?'active':''}" onclick="state.view='calc';render()">Máy tính</button><button class="top-tab ${state.view==='compare'?'active':''}" onclick="state.view='compare';render()">So sánh</button><button class="top-tab ${state.view==='guide'?'active':''}" onclick="state.view='guide';render()">Hướng dẫn</button><span class="offline">● Offline / Local data</span></div></header>${state.view==='guide'?guide():state.view==='compare'?compare():`<div class="modebar"><button class="mode ${state.mode==='room'?'active':''}" onclick="setMode('room')"><span class="mode-icon">✦</span><span><strong>Tính theo phòng</strong><small>Nhập rộng/dài → gợi ý model + màn</small></span></button><button class="mode ${state.mode==='model'?'active':''}" onclick="setMode('model')"><span class="mode-icon">▣</span><span><strong>Tính theo model</strong><small>Chọn máy + màn → ra khoảng cách</small></span></button></div><div class="grid">${form()}${result()}</div>`}</main>`};
  render();
</script>
<script>
  const GUIDE_HELP = [
    {number:'01',title:'Chọn luồng tính',copy:'Chọn Tính theo phòng nếu chưa biết máy. Chọn Tính theo model nếu đã có hãng, model và muốn kiểm tra vị trí lắp.',action:'Bấm một trong hai thẻ ở thanh chuyển chế độ.',kind:'flow'},
    {number:'02',title:'Nhập kích thước phòng',copy:'Điền Chiều rộng và Chiều dài phòng bằng mét. Hai ô để trống mặc định để tránh dùng nhầm số mẫu.',action:'Nhập số đo thực tế vào hai ô có đơn vị m.',kind:'room'},
    {number:'03',title:'Chọn màn và model',copy:'Chọn preset màn hoặc Màn tùy chỉnh. Ở luồng theo model, chọn hãng và model có throw ratio.',action:'Mở bộ chọn màn, hãng hoặc model ở cột thông tin phòng.',kind:'screen'},
    {number:'04',title:'Đọc vùng lắp đặt',copy:'Kết quả min – max là vùng đặt máy từ thấu kính đến mặt màn. Khoảng lý tưởng là giá trị trung bình.',action:'Đặt thấu kính trong dải màu xanh và kiểm tra chiều sâu phòng.',kind:'distance'},
    {number:'05',title:'So sánh model',copy:'Mở tab So sánh để đặt hai model cạnh nhau theo độ sáng, độ phân giải, aspect ratio và throw ratio.',action:'Chọn Model A và Model B rồi đọc bảng đối chiếu.',kind:'compare'},
    {number:'06',title:'Xuất báo cáo PDF',copy:'Khi đã nhập đủ phòng, bấm Xuất PDF để lưu phương án, vùng lắp, sơ đồ và cảnh báo kỹ thuật.',action:'Bấm nút Xuất PDF ở góc phải thẻ kết quả.',kind:'pdf'},
    {number:'07',title:'Thêm model mới',copy:'Nếu model chưa có trong catalog, chọn Thêm model rồi nhập tên model và thông số lấy từ datasheet chính thức.',action:'Chuẩn bị hãng, tên model, độ sáng, độ phân giải, tỷ lệ khung hình và throw ratio min/max.',kind:'add-model'}
  ];
  function guideVisual(kind){
    if(kind==='flow') return `<div class="gvis flow"><span class="glabel">CHỌN LUỒNG</span><div class="gflow active">✦ <b>Tính theo phòng</b><small>Nhập phòng → gợi ý</small></div><div class="gflow">▣ <b>Tính theo model</b><small>Chọn máy → khoảng cách</small></div></div>`;
    if(kind==='room') return `<div class="gvis room"><span class="glabel">THÔNG TIN PHÒNG</span><div class="gfields"><div><small>CHIỀU RỘNG</small><b>____</b><em>m</em></div><div><small>CHIỀU DÀI</small><b>____</b><em>m</em></div></div><div class="gmeasure">kích thước thực tế</div><div class="garea">Diện tích sàn <b>— m²</b></div></div>`;
    if(kind==='screen') return `<div class="gvis screen"><span class="glabel">MÀN CHIẾU / MODEL</span><div class="gselect"><small>KÍCH THƯỚC MÀN</small><b>MÀN 150" (3,05 m × 2,3 m)</b><span>⌄</span></div><div class="gselect"><small>MODEL MÁY CHIẾU</small><b>Panasonic PT-LB306</b><span>⌄</span></div></div>`;
    if(kind==='distance') return `<div class="gvis distance"><span class="glabel">MẶT CẮT / KHÔNG THEO TỶ LỆ</span><div class="gwall">MÀN</div><div class="gprojector">▣</div><div class="gline"><i></i>4,44 m – 7,20 m<i></i></div><b>VÙNG LẮP ĐẶT</b></div>`;
    if(kind==='compare') return `<div class="gvis compare"><span class="glabel">ĐỐI CHIẾU THIẾT BỊ</span><div class="gthead"><span>Thông số</span><b>Model A</b><b>Model B</b></div>${['Độ sáng','Độ phân giải','Throw ratio'].map(row=>`<div class="gtrow"><span>${row}</span><b>—</b><b>—</b></div>`).join('')}</div>`;
    if(kind==='add-model') return `<div class="gvis add-model"><span class="glabel">THÊM MODEL / DATASHEET</span><div class="gadd-field"><small>TÊN MODEL</small><b>PT-NEW-001</b></div><div class="gadd-grid"><div><small>THROW MIN</small><b>1,20 : 1</b></div><div><small>THROW MAX</small><b>1,80 : 1</b></div><div><small>ĐỘ SÁNG</small><b>4.000 lm</b></div><div><small>ĐỘ PHÂN GIẢI</small><b>WUXGA</b></div></div><div class="gadd-note">ⓘ Chỉ nhập số liệu có trong datasheet chính thức</div></div>`;
    return `<div class="gvis pdf"><span class="glabel">BÁO CÁO TÍNH TOÁN</span><div class="gpage"><b>Bố trí máy chiếu</b><i></i><i></i><i class="short"></i><div class="gchart"><em></em><em></em><em></em></div></div><strong>⇩ XUẤT PDF</strong></div>`;
  }
  function interactiveGuide(){
    const index=Math.max(0,Math.min(GUIDE_HELP.length-1,Number(state.guideStep)||0));
    const step=GUIDE_HELP[index];
    return `<section class="card guide"><div class="cardhead"><div><h2>Hướng dẫn sử dụng</h2><span class="step">04 / GUIDE</span></div><span>?</span></div><div class="guide-intro">Chọn từng bước ở cột trái. Phần minh họa bên phải sẽ chỉ rõ nơi cần chọn, cần nhập hoặc cần đọc.</div><div class="guide-workspace"><nav class="guide-index">${GUIDE_HELP.map((item,i)=>`<button class="guide-index-item ${i===index?'active':''}" onclick="state.guideStep=${i};render()"><span>${item.number}</span><b>${item.title}</b><em>→</em></button>`).join('')}</nav><article class="guide-detail"><div class="guide-copy"><span class="guide-num">${step.number}</span><h3>${step.title}</h3><p>${step.copy}</p><div class="guide-action"><small>CẦN LÀM</small><b>${step.action}</b></div></div>${guideVisual(step.kind)}</article></div><div class="guide-note">ⓘ Throw ratio thiếu dữ liệu sẽ luôn hiển thị “Chưa có throw ratio”. Trước khi thi công, vẫn cần kiểm tra manual chính thức.</div></section>`;
  }
  const standaloneRenderBeforeLabels = render;
  render = function(){
    standaloneRenderBeforeLabels();
    if (!document.querySelector('.skip-link')) {
      const skip = document.createElement('a');
      skip.className = 'skip-link';
      skip.href = '#top';
      skip.textContent = 'Bỏ qua thanh điều hướng, đến nội dung chính';
      document.body.prepend(skip);
    }
    const main = document.querySelector('.main');
    if (main) { main.id = 'top'; main.setAttribute('role', 'main'); }
    const roomInputs = [...document.querySelectorAll('.form input[type="number"]')];
    const roomHints = [...document.querySelectorAll('.form > .row .hint')];
    roomInputs.forEach((input, index) => {
      input.setAttribute('min', '0.5');
      input.setAttribute('max', '100');
      input.setAttribute('aria-label', index === 0 ? 'Chiều rộng phòng' : 'Chiều dài phòng');
      const hintId = index === 0 ? 'room-width-hint' : 'room-depth-hint';
      roomHints[index]?.setAttribute('id', hintId);
      input.setAttribute('aria-describedby', `${hintId} room-validation`);
    });
    document.querySelector('.data-note')?.setAttribute('aria-live', 'polite');
    document.querySelector('.form .field-error')?.remove();
    if (state.roomError) {
      const error = document.createElement('p');
      error.id = 'room-validation';
      error.className = 'field-error';
      error.setAttribute('role', 'alert');
      error.textContent = state.roomError;
      document.querySelector('.form > .row')?.after(error);
    }
    const categoryLabel = [...document.querySelectorAll('.side .navlabel')].find((label) => label.textContent.trim() === 'DANH MỤC');
    if (categoryLabel) {
      let node = categoryLabel.nextElementSibling;
      categoryLabel.remove();
      while (node && node.classList.contains('nav') && !node.textContent.includes('Thêm model')) {
        const next = node.nextElementSibling;
        node.remove();
        node = next;
      }
    }
    const guideNav = [...document.querySelectorAll('.side .nav')].find((button) => button.textContent.includes('Hướng dẫn'));
    guideNav?.classList.add('guide-nav');
    const logo = document.querySelector('.side .logo');
    if (logo) {
      const logoImage = logo.querySelector('.logo-mark');
      const logoText = logo.querySelector('span');
      if (logoImage) { logoImage.src = 'https://projplanvn-7k49qncz.manus.space/manus-storage/thanh-ha-office-machines-logo_3a44d862.png'; logoImage.alt = 'Logo Thanh Hà'; }
      if (logoText) logoText.innerHTML = '<strong>THIẾT BỊ VĂN PHÒNG</strong><b>THANH HÀ</b>';
      logo.setAttribute('aria-label', 'Thiết bị Văn phòng Thanh Hà');
    }
    if (state.view === 'guide') {
      const oldGuide = document.querySelector('.guide');
      if (oldGuide) oldGuide.outerHTML = interactiveGuide();
    }
    document.querySelectorAll('.room img').forEach((image) => {
      image.src = 'https://projplanvn-7k49qncz.manus.space/manus-storage/projector-room-modern_ecc77659.png';
      image.alt = 'Sơ đồ phòng sáng hiện đại với máy chiếu treo trong vùng lắp đặt và màn chiếu';
    });
    document.querySelectorAll('.distance-pill').forEach((pill) => {
      const value = pill.textContent.trim();
      if (value && value !== '—' && !value.startsWith('Khoảng cách lý tưởng')) pill.textContent = `Khoảng cách lý tưởng: ${value}`;
    });
    document.querySelectorAll('.field label').forEach((label) => {
      if (label.textContent.trim() === 'Rộng phòng') label.textContent = `Chiều rộng${state.mode === 'model' ? ' (tùy chọn)' : ''}`;
      if (label.textContent.trim() === 'Dài phòng') label.textContent = `Chiều dài${state.mode === 'model' ? ' (tùy chọn)' : ''}`;
    });
    document.querySelectorAll('.kpi span').forEach((label) => {
      if (label.textContent.trim() === 'Màn đề xuất') label.textContent = 'Màn chiếu';
      if (label.textContent.trim() === 'Model đang tính') label.textContent = 'Máy chiếu';
    });
    const screenKpi = [...document.querySelectorAll('.kpi')].find((card) => card.querySelector('span')?.textContent.trim() === 'Màn chiếu');
    if (screenKpi) {
      const screen = calc().s;
      const note = screenKpi.querySelector('small');
      if (note) note.textContent = `Chiều ngang dùng để tính: ${fmt(screen.width)} m · tỷ lệ ${screen.ratio || '—'}`;
    }
    document.querySelectorAll('.suggest-head small').forEach((label) => { label.textContent = 'Vừa vùng trước · giá thấp → cao'; });
    const suggestionsBox = document.querySelector('.suggestions');
    if (suggestionsBox) {
      const primary = suggestionsBox.parentElement?.querySelector('.recommend > div:first-child b')?.textContent.trim() || '';
      const items = [...suggestionsBox.querySelectorAll('.suggest-item')].map((button, index) => {
        const model = PROJECTORS.find((projector) => button.textContent.includes(projector.model));
        const price = model ? PROJECTOR_PRICES[model.model] ?? Number.POSITIVE_INFINITY : Number.POSITIVE_INFINITY;
        const fits = !button.querySelector('.status.neutral');
        return { button, index, price, fits, isPrimary: primary.includes(model?.model || '') };
      }).filter((item) => !item.isPrimary).sort((left, right) => Number(right.fits) - Number(left.fits) || left.price - right.price || left.index - right.index);
      items.forEach(({ button }) => suggestionsBox.appendChild(button));
    }
  };
  render();
</script>
</body>
</html>
